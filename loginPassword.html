<!DOCTYPE html>
<html>
<head>
    <title>Registrati</title>
    <script>
	const TEST = 0;
        function register() {
			if(TEST){
            	alert("register");
            }
            
            // take the input
            let username = document.getElementById('uName').value;
            let password = document.getElementById('psw').value;
            let name = document.getElementById('name').value;

            // ceck if the input isn't empty
            if (username != "" && password != "") {
                
				if(TEST){
					//test
					alert(username);
					alert(password);
					alert(name);
				}
				//check psw
				if(password.length < 6){
				
					alert("Password troppo corta!");
					 document.getElementById('psw').style.backgroundColor = 'red';
				
				}else{
                
                	if(password == username){
                    
                    	alert("Password e Username devono essere diversi!");
                        document.getElementById('psw').style.backgroundColor = 'red';
					document.getElementById('uName').style.backgroundColor = 'red';
                    
                    }else{
                    
                    	alert("Registrazione effettuata correttamente, Buongiorno " + username);
                    	document.getElementById('psw').style.backgroundColor = 'green';
					document.getElementById('uName').style.backgroundColor = 'green';
                    document.getElementById('name').style.backgroundColor = 'green';
				
                    }
                
                }
				
            } else {
                alert("Riempi i campi di username e password!");
				document.getElementById('psw').style.backgroundColor = 'red';
				document.getElementById('uName').style.backgroundColor = 'red';
            }
        }
    </script>
</head>
<body>

<h2>Registrati</h2>


    <label for="uName">Username:</label><br>
    <input type="text" id="uName" value=""><br>
    <label for="psw">Password:</label><br>
    <input type="text" id="psw" value=""><br>
    
    <label for="name">Nome: (facoltativo)</label><br>
    <input type="text" id="name" value=""><br><br>
    <button type="button" onclick="register()">Registrati</button>


<p>Regole:<br>

- Password: MINIMO 6 CARATTERI<br>
- Nome: FACOLTATIVO<br>
- Password e Username devono essere diversi!</p>

</body>
</html>
